name: NPM Multi-Project check (npm ci + build + test)

# Read-only check: for each project folder (in parallel) run npm ci, build and test from the committed
# package.json / package-lock.json, then fail the project and annotate the run if anything is wrong.
# Nothing is written back, pushed or uploaded; any change to package.json / package-lock.json is itself reported.
# Nexus (nexus.rez1.com) is private, so each job opens the same SSH tunnel the other shared workflows use.
# The registry and credentials come from the NPMRC secret (full .npmrc content), not from files in the repo.
on:
  workflow_call:
    secrets:
      SSH_JUMP_HOST_USER:
        required: true
      SSH_JUMP_HOST_KEY:
        required: true
      SSH_JUMP_HOST_IP:
        required: true
      NPMRC:
        required: true
    inputs:
      projects:
        description: 'JSON array of project folders, e.g. ["blume-button","blume-ui"]'
        required: true
        type: string
      run-build:
        description: 'Run "npm run build" when the project defines it'
        required: false
        default: true
        type: boolean
      run-tests:
        description: 'Run "npm test" when the project defines it'
        required: false
        default: true
        type: boolean
      node-version:
        required: false
        default: '20'
        type: string
      sibling-installs:
        description: 'JSON map of project -> folders that need npm ci before its build, e.g. {"portal":["blume-grid-ui"]}'
        required: false
        default: '{}'
        type: string
      max-parallel:
        required: false
        default: 10
        type: number

jobs:
  project:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure SSH
        run: |
          mkdir -p /home/runner/.ssh/
          echo "$SSH_KEY" > /home/runner/.ssh/nexus.key
          chmod 600 /home/runner/.ssh/nexus.key
          cat >>/home/runner/.ssh/config <<END
          Host nexus
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile /home/runner/.ssh/nexus.key
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 30
          END
        env:
          SSH_USER: ${{ secrets.SSH_JUMP_HOST_USER }}
          SSH_KEY: ${{ secrets.SSH_JUMP_HOST_KEY }}
          SSH_HOST: ${{ secrets.SSH_JUMP_HOST_IP }}

      - name: Execute ssh port forward
        run: |
          sudo echo "127.0.0.1 nexus.rez1.com nexus" | sudo tee -a /etc/hosts
          sudo ssh -4 -fN -F /home/runner/.ssh/config -L0.0.0.0:443:nexus.rez1.com:443 nexus

      - name: Configure npm from secret
        env:
          NPMRC: ${{ secrets.NPMRC }}
        run: |
          printf '%s\n' "$NPMRC" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          # A committed project .npmrc would override the secret, so drop any from the checkout.
          find . -name .npmrc -not -path '*/node_modules/*' -delete

      - name: Check Nexus registry (informational)
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nexus.rez1.com/repository/npm/ || true)
          echo "Nexus registry answered HTTP ${code:-none}"

      - name: Install sibling build dependencies
        if: ${{ inputs.run-build }}
        env:
          SIBLINGS: ${{ inputs.sibling-installs }}
          PROJECT: ${{ matrix.project }}
        run: |
          for dir in $(echo "$SIBLINGS" | jq -r --arg p "$PROJECT" '.[$p][]?'); do
            echo "::group::npm ci in sibling $dir"
            (cd "$dir" && npm ci --legacy-peer-deps --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: npm ci
        id: ci
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/ci.log"

      # --legacy-peer-deps skips peers, but the host app normally supplies them; --no-save leaves package files untouched.
      - name: Install missing peer dependencies (not saved)
        id: peers
        if: ${{ steps.ci.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: |
          set -o pipefail
          node -e '
            const { spawnSync } = require("child_process");
            const j = require("./package.json");
            const lock = require("./package-lock.json").packages;
            const specs = Object.entries(j.peerDependencies || {})
              .filter(([n]) => !lock["node_modules/" + n])
              .map(([n, v]) => n + "@" + v);
            if (!specs.length) { console.log("No missing peer dependencies."); process.exit(0); }
            console.log("Installing peers (not saved): " + specs.join(" "));
            const r = spawnSync("npm", ["install", "--no-save", "--legacy-peer-deps", "--no-audit", "--no-fund", ...specs], { stdio: "inherit" });
            process.exit(r.status === null ? 1 : r.status);
          ' 2>&1 | tee "$RUNNER_TEMP/peers.log"

      - name: Build
        id: build
        if: ${{ inputs.run-build && steps.ci.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        run: |
          set -o pipefail
          npm run build --if-present 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Test
        id: test
        if: ${{ inputs.run-tests && steps.ci.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ matrix.project }}
        env:
          CI: 'true'
        run: |
          set -o pipefail
          npm test --if-present -- --passWithNoTests 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Steps above never fail the job themselves, so this one reports every result and fails the project.
      - name: Report
        if: ${{ always() }}
        working-directory: ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
          CI_RESULT: ${{ steps.ci.outcome }}
          PEERS_RESULT: ${{ steps.peers.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
        run: |
          failed=0
          modified=$(git status --porcelain -- package.json package-lock.json)
          {
            echo "### $PROJECT"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| npm ci | $CI_RESULT |"
            echo "| peer dependencies | $PEERS_RESULT |"
            echo "| build | $BUILD_RESULT |"
            echo "| test | $TEST_RESULT |"
            echo "| package.json / package-lock.json untouched | $([ -z "$modified" ] && echo yes || echo NO) |"
          } >> "$GITHUB_STEP_SUMMARY"

          for step in ci peers build test; do
            case $step in ci) result=$CI_RESULT ;; peers) result=$PEERS_RESULT ;; build) result=$BUILD_RESULT ;; test) result=$TEST_RESULT ;; esac
            if [ "$result" = "failure" ]; then
              first=$(grep -m3 -E 'npm (error|ERR!)|FAIL|Error:' "$RUNNER_TEMP/$step.log" 2>/dev/null | tr '\n' ' ' | cut -c1-300)
              echo "::error title=$PROJECT: $step failed::${first:-see the '$step' step log}"
              failed=1
            fi
          done
          if [ -n "$modified" ]; then
            echo "::error title=$PROJECT: files were modified::$(echo "$modified" | tr '\n' ' ')"
            failed=1
          fi
          exit $failed
