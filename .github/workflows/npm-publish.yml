name: NPM Publish (to Nexus)

# Publishes a list of project folders to the private Nexus registry, in parallel.
# It publishes exactly what is committed: versions and lockfiles are never changed here, so bump and commit first.
# Call it once per phase (internal blume-* dependencies must be published before their consumers).
# Per project: npm ci -> skip if name@version is already in Nexus -> npm publish -> verify.
# Nexus is private, so each job opens the same SSH tunnel the other shared workflows use.
# The NPMRC secret holds the full .npmrc content, including auth for the publish registry.
on:
  workflow_call:
    secrets:
      SSH_JUMP_HOST_USER:
        required: true
      SSH_JUMP_HOST_KEY:
        required: true
      SSH_JUMP_HOST_IP:
        required: true
      NPMRC:
        required: true
    inputs:
      projects:
        description: 'JSON array of project folders, e.g. ["blume-button","blume-ui"]'
        required: true
        type: string
      dry-run:
        description: 'Run "npm publish --dry-run" (builds and packs, uploads nothing)'
        required: false
        default: true
        type: boolean
      skip-published:
        description: 'Skip projects whose name@version already exists in the registry (lets a failed run be re-run)'
        required: false
        default: true
        type: boolean
      registry:
        description: 'Hosted registry that receives the publish'
        required: false
        default: 'https://nexus.rez1.com/repository/npm-private/'
        type: string
      node-version:
        required: false
        default: '20'
        type: string
      max-parallel:
        required: false
        default: 10
        type: number

jobs:
  publish:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure SSH
        run: |
          mkdir -p /home/runner/.ssh/
          echo "$SSH_KEY" > /home/runner/.ssh/nexus.key
          chmod 600 /home/runner/.ssh/nexus.key
          cat >>/home/runner/.ssh/config <<END
          Host nexus
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile /home/runner/.ssh/nexus.key
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 30
          END
        env:
          SSH_USER: ${{ secrets.SSH_JUMP_HOST_USER }}
          SSH_KEY: ${{ secrets.SSH_JUMP_HOST_KEY }}
          SSH_HOST: ${{ secrets.SSH_JUMP_HOST_IP }}

      - name: Execute ssh port forward
        run: |
          sudo echo "127.0.0.1 nexus.rez1.com nexus" | sudo tee -a /etc/hosts
          sudo ssh -4 -fN -F /home/runner/.ssh/config -L0.0.0.0:443:nexus.rez1.com:443 nexus

      - name: Configure npm from secret
        env:
          NPMRC: ${{ secrets.NPMRC }}
        run: |
          printf '%s\n' "$NPMRC" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          # A committed project .npmrc would override the secret, so drop any from the checkout.
          find . -name .npmrc -not -path '*/node_modules/*' -delete

      - name: Check Nexus registry (informational)
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nexus.rez1.com/repository/npm/ || true)
          echo "Nexus registry answered HTTP ${code:-none}"

      - name: npm ci
        working-directory: ${{ matrix.project }}
        run: npm ci --legacy-peer-deps --no-audit --no-fund --prefer-online

      - name: Check whether this version is already published
        id: version
        working-directory: ${{ matrix.project }}
        env:
          REGISTRY: ${{ inputs.registry }}
          SKIP_PUBLISHED: ${{ inputs.skip-published }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          existing=$(npm view "$name@$version" version --registry="$REGISTRY" --prefer-online 2>/dev/null | tail -1 || true)
          if [ -n "$existing" ] && [ "$SKIP_PUBLISHED" = "true" ]; then
            echo "$name@$version is already in the registry; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$existing" ]; then
            echo "::error::$name@$version already exists in the registry. Bump the version and commit it."
            exit 1
          else
            echo "$name@$version is not published yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: ${{ steps.version.outputs.skip != 'true' }}
        working-directory: ${{ matrix.project }}
        env:
          REGISTRY: ${{ inputs.registry }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(publish --registry "$REGISTRY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm "${args[@]}"

      - name: Verify published version
        if: ${{ !inputs.dry-run && steps.version.outputs.skip != 'true' }}
        env:
          PKG: ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          found=$(npm view "$PKG" version --registry="$REGISTRY" --prefer-online | tail -1)
          echo "Nexus reports: $found"
          [ -n "$found" ]
