# Successor to build-test-release-java11.yml. Same inputs and secrets, so migrating is a
# one-line change to the `uses:` reference.
#
# Adopting repos must also add this to the root build.gradle, or SNAPSHOTs go stale for 24h:
#
#   buildscript {
#     configurations.classpath {
#       resolutionStrategy { cacheChangingModulesFor 0, 'seconds' }
#     }
#   }
#   allprojects {
#     configurations.all {
#       resolutionStrategy {
#         cacheChangingModulesFor 0, 'seconds'
#         cacheDynamicVersionsFor 0, 'seconds'
#       }
#     }
#   }
#
# The buildscript half cannot be supplied by a Blume plugin: core-build-plugins is itself on
# the buildscript classpath, so Gradle resolves it before any plugin code can run.
#
# Also note that this workflow no longer force-publishes images from WI* branches. Declare
# "WI**" in branchesToPublishImages / branchesToPublishImagesToOCR to keep that behaviour.
#
# Exists separately from build-test-release-java11.yml so the ~57 consuming repos migrate one
# at a time. Delete that file once they have all moved over.
name: Build and Test Quality Gate
on:
  workflow_call:
    secrets:
      SSH_JUMP_HOST_USER:
        required: true
      SSH_JUMP_HOST_KEY:
        required: true
      SSH_JUMP_HOST_IP:
        required: true
      GCR_CREDENTIALS:
        required: true
      OCP_REGISTRY_TOKEN:
        required: false
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false
      JIRA_API_TOKEN:
        required: true
      CORE_APP_ID:
        required: false
      CORE_APP_PRIVATE_KEY:
        required: false
    inputs:
      branchesToPublishArtifacts:
        description: 'Branches To Publish Artifacts'
        required: false
        default: '["dev", "qa", "test", "uat", "main", "master"]'
        type: string
      branchesToPublishImages:
        description: 'Branches To Publish Docker Images to GCR'
        required: false
        default: '["dev", "qa", "test", "uat", "main", "master"]'
        type: string
      branchesToPublishImagesToOCR:
        description: 'Branches To Publish Docker Images to OCR'
        required: false
        default: '["dev", "qa", "test", "uat", "main", "master"]'
        type: string
      createAppToken:
        description: 'Whether to generate a GitHub App token for cross-repo operations'
        required: false
        default: false
        type: boolean
      runsOn:
        description: 'The runner label to use for the job'
        required: false
        default: 'ubuntu-latest'
        type: string
      reposToClone:
        description: 'JSON array of repos to clone as vendor deps before Docker build'
        required: false
        default: '[]'
        type: string
      refreshDependencies:
        description: 'Bypass the Gradle cache and re-resolve every dependency from the remote repositories. Slow by design. The run also rewrites the cache, so the runs after it are fast again. Caches are scoped per branch with fallback to the default branch, so dispatch this on the default branch to reseed the cache that every other branch reads.'
        required: false
        default: false
        type: boolean
permissions: write-all
jobs:
  build-and-test:
    name: Build and Test Quality Gate Job
    runs-on: ${{ inputs.runsOn }}
    env:
      ORG_GRADLE_PROJECT_nexusUsername: ${{ secrets.NEXUS_USERNAME }}
      ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
      CI: false
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
      - name: Extract branch name and commit hash
        shell: bash
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            echo "##[set-output name=short_sha;]$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-8)"
            echo "##[set-output name=branch_name;]$(echo ${GITHUB_HEAD_REF#refs/heads/})"
            BRANCH_NAME="${GITHUB_HEAD_REF#refs/heads/}"
          else
            echo "##[set-output name=short_sha;]$(echo ${{ github.sha }} | cut -c1-8)"
            echo "##[set-output name=branch_name;]$(echo ${GITHUB_REF#refs/heads/})"
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi

          # Check if branch matches any wildcard pattern in branchesToPublishArtifacts
          ARTIFACT_MATCH="false"
          for pattern in $(echo '${{ inputs.branchesToPublishArtifacts }}' | jq -r '.[]'); do
            if [[ "$pattern" == *"**"* ]]; then
              prefix="${pattern%%\*\*}"
              prefix="${prefix%/}"
              if [[ "$BRANCH_NAME" == "$prefix"* ]]; then
                ARTIFACT_MATCH="true"
                break
              fi
            fi
          done
          echo "##[set-output name=artifact_pattern_match;]${ARTIFACT_MATCH}"

          # Check if branch matches any wildcard pattern in branchesToPublishImages
          IMAGE_MATCH="false"
          for pattern in $(echo '${{ inputs.branchesToPublishImages }}' | jq -r '.[]'); do
            if [[ "$pattern" == *"**"* ]]; then
              prefix="${pattern%%\*\*}"
              prefix="${prefix%/}"
              if [[ "$BRANCH_NAME" == "$prefix"* ]]; then
                IMAGE_MATCH="true"
                break
              fi
            fi
          done
          echo "##[set-output name=image_pattern_match;]${IMAGE_MATCH}"

          # Check if branch matches any wildcard pattern in branchesToPublishImagesToOCR
          OCR_MATCH="false"
          for pattern in $(echo '${{ inputs.branchesToPublishImagesToOCR }}' | jq -r '.[]'); do
            if [[ "$pattern" == *"**"* ]]; then
              prefix="${pattern%%\*\*}"
              prefix="${prefix%/}"
              if [[ "$BRANCH_NAME" == "$prefix"* ]]; then
                OCR_MATCH="true"
                break
              fi
            fi
          done
          echo "##[set-output name=ocr_pattern_match;]${OCR_MATCH}"
        id: extract_git_branch_info

      - run: echo "🎉 The job was automatically triggered for the commit ${{ steps.extract_git_branch_info.outputs.short_sha }} in branch ${{ steps.extract_git_branch_info.outputs.branch_name }} by a ${{ github.event_name }} event."
      
      - name: Dump GitHub context
        id: github_context_step
        run: echo $JSON
        env:
          JSON: ${{ toJSON(github) }}
          
      - name: Check out repository code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

# JIRA ID Validation for PRs against releases branch ---- start
#      - name : Get Jira ID from Title of PR
#        if: github.event_name == 'pull_request' && startsWith( github.base_ref, 'releases')
#        run: |
#            echo Extracting Jira Id from PR Title: '${{ github.event.pull_request.title }}'
#            echo IMPORTANT!!! PR Titile should have Jira Id enclosed in square brackets like [AR-419] and not have any special characters in it
#            echo '${{ github.event.pull_request.title }}' | sed -n 's/.*\[\(.*\)\].*/\1/p'
#            echo "::set-output name=jira_id::$(echo '${{ github.event.pull_request.title }}' | sed -n 's/.*\[\(.*\)\].*/\1/p')"
#            echo "::set-output name=release::$(echo ${{ github.base_ref }} | sed -n 's/releases\/\(.*\)/\1/p')"
#            echo '${{ github.event.pull_request.title }}' | grep -e '\[\(.*\)\]'
#        id: extract_jira_id 
#      
#      - name : Validate Jira ID
#        if: github.event_name == 'pull_request' && startsWith( github.base_ref, 'releases')
#        env:
#          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
#        run: |
#          echo 'There should be a valid issue on Jira for the id ${{ steps.extract_jira_id.outputs.jira_id }}'
#          curl -s --request GET \
#          --url "https://rezone.atlassian.net/rest/api/2/issue/${{ steps.extract_jira_id.outputs.jira_id }}?fields=summary" \
#          --header "Authorization: Basic $JIRA_API_TOKEN" \
#          -w '\nstatus%{http_code}\n' | grep status200
#        
#        id: validate_jira_id
#
#      - name : Validate if Jira ID belongs to a release
#        if: 1 == 2 && github.event_name == 'pull_request' && startsWith( github.base_ref, 'releases')
#        env:
#          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
#        run: |
#          echo '${{ steps.extract_jira_id.outputs.jira_id }} should belong to the ${{ github.base_ref }}'
#          curl -s --request GET \
#          --url "https://rezone.atlassian.net/rest/api/2/issue/${{ steps.extract_jira_id.outputs.jira_id }}?fields=customfield_12803" \
#          --header "Authorization: Basic $JIRA_API_TOKEN" \
#          | sed -n 's/.*fields.*{\(.*\)}.*/\1/p' | grep -i '${{ steps.extract_jira_id.outputs.release }}'
#  
# JIRA ID Validation for PRs against releases branch - end

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'

      # Replaces gradle/gradle-build-action@v2, which is archived and still calls the
      # actions/cache v1/v2 API that GitHub retired in March 2025. Every run using it failed
      # to restore ("Cache service responded with 400") and failed to save, so the Gradle
      # User Home was empty on every single run and the whole dependency graph, plus the
      # Gradle distribution itself, was re-downloaded from nexus over the SSH tunnel.
      #
      # Pinned to v4 on purpose. v6 defaults to cache-provider: enhanced, which routes cache
      # contents through a Gradle-operated third-party service. Revisit only deliberately.
      #
      # v4 removed the `arguments:` input, so this step no longer runs Gradle. It only
      # configures caching, and the ./gradlew calls below are plain run: steps. It must stay
      # ahead of the first of them.
      #
      # cache-read-only defaults to true on non-default branches, so feature branches read
      # the shared cache without competing to write it. cache-write-only is the escape hatch:
      # skip the restore, resolve cold, then repopulate the cache for subsequent runs.
      # THROWAWAY TEST BRANCH - DO NOT MERGE.
      # cache-read-only is forced false so a non-default test branch writes the cache and a
      # second run on it can restore. Without this both runs are cold and measure nothing.
      # cache-migration carries the real default.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-write-only: ${{ inputs.refreshDependencies }}
          validate-wrappers: false

      - name: Configure SSH
        run: |
          pwd
          mkdir -p /home/runner/.ssh/
          echo "$SSH_KEY" > /home/runner/.ssh/nexus.key
          chmod 600 /home/runner/.ssh/nexus.key
          cat >>/home/runner/.ssh/config <<END
          Host nexus
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile /home/runner/.ssh/nexus.key
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 30
          END
        env:
          SSH_USER: ${{ secrets.SSH_JUMP_HOST_USER }}
          SSH_KEY: ${{ secrets.SSH_JUMP_HOST_KEY }}
          SSH_HOST: ${{ secrets.SSH_JUMP_HOST_IP }}

      - name: Execute ssh port forward
        run: |
          sudo echo "127.0.0.1 nexus.rez1.com nexus kubernetes data-blume-devdb-5.rez1.com" | sudo tee -a /etc/hosts
          sudo ssh -4 -fN -F /home/runner/.ssh/config -L0.0.0.0:443:nexus.rez1.com:443 nexus
      - name: Configure GCR
        run: |
          mkdir -p $HOME/.gcr/
          echo "$GCR_CREDENTIALS" > $HOME/.gcr/gcr_sa_key.json
          chmod 600 $HOME/.gcr/gcr_sa_key.json
        env:
          GCR_CREDENTIALS: ${{ secrets.GCR_CREDENTIALS }}

      
      - name: SSH port forward for code_analysis db
        continue-on-error: true
        run: |
          sudo ssh -4 -fN -F /home/runner/.ssh/config -L0.0.0.0:7193:data-blume-devdb-5.rez1.com:3306 nexus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Generate GitHub App token
        id: app-token
        if: inputs.createAppToken == true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CORE_APP_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Clone vendored dependency repos
        if: inputs.createAppToken == true && inputs.reposToClone != '[]' && inputs.reposToClone != ''
        run: |
          for repo_branch in $(echo '${{ inputs.reposToClone }}' | jq -r '.[]'); do
            repo=$(echo $repo_branch | cut -d@ -f1)
            branch=$(echo $repo_branch | cut -d@ -f2)
            name=$(basename $repo)
            rm -rf ${name}
            if [ "$branch" != "$repo_branch" ]; then
              git clone -b $branch https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${repo}.git ${name}
            else
              git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${repo}.git ${name}
            fi
          done

      - name: docker compose up
        run: docker compose up -d

      # --refresh-dependencies is no longer unconditional. It invalidated cached metadata for
      # every module on every run, which would defeat the cache. Repos keep their SNAPSHOTs
      # fresh with resolutionStrategy.cacheChangingModulesFor 0 in build.gradle, which
      # revalidates only the modules that can actually change. See the header comment.
      - name: Build with Gradle
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: ./gradlew clean build ${{ inputs.refreshDependencies && '--refresh-dependencies' || '' }} -PbranchName=${{ steps.extract_git_branch_info.outputs.branch_name }} -PbaseRef=${{ github.base_ref }}
        id: gradle_build

      - name: Publish Test Reports
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v1
        if: always()
        with:
          files: "**/build/test-results/test/*.xml"
          
      - name: Publish Test Reports Off
        uses: mikepenz/action-junit-report@v3
        if: false
        with:
          files: "**/build/test-results/test/*.xml"

      - name: TDD Validation
        if: steps.gradle_build.outcome == 'success'
        run: ./gradlew :tddValidation -PbranchName=${{ steps.extract_git_branch_info.outputs.branch_name }} -PbaseRef=${{ github.base_ref }}

      - name: docker compose down
        if: always()
        continue-on-error: true
        run: docker compose down -v

      - name: Stop Gradle daemon
        if: always()
        continue-on-error: true
        run: ./gradlew --stop

      - name: Should Publish JARs
        continue-on-error: true
        run: ./gradlew tasks --all | grep -w "publish"
        id: publish_jar
       
      - name: Publish JAR branches   
        if: steps.publish_jar.outcome == 'success'
        run: echo "JAR publishing configured for branches - ${{ inputs.branchesToPublishArtifacts }}"

      - name: Publish JAR Artifacts
        if: steps.publish_jar.outcome == 'success' && ( contains(fromJSON(inputs.branchesToPublishArtifacts), steps.extract_git_branch_info.outputs.branch_name) || steps.extract_git_branch_info.outputs.artifact_pattern_match == 'true' || startsWith(steps.extract_git_branch_info.outputs.branch_name, 'releases') || startsWith(github.ref, 'refs/tags/v') )
        run: ./gradlew publish -Pgithubref=${{github.ref}} -PbranchName=${{ steps.extract_git_branch_info.outputs.branch_name }}

      - name: Should Pubish DockerImage
        continue-on-error: true
        run: ./gradlew tasks --all | grep -w "publishDockerImage"
        id: publish_gcr

      - name: Configure Docker Image
        if: steps.publish_gcr.outcome == 'success' && !startsWith(github.ref, 'refs/tags/RC')
        id: 'docker-image-config'
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            echo '::set-output name=image_name::${{ steps.extract_git_branch_info.outputs.branch_name }}-${{ steps.extract_git_branch_info.outputs.short_sha }}-pr'
          elif [[ ${{ github.event_name }} == 'push' ]]; then
            echo '::set-output name=image_name::${{ steps.extract_git_branch_info.outputs.branch_name }}-${{ steps.extract_git_branch_info.outputs.short_sha }}'
          else
            echo '::set-output name=image_name::${{ steps.extract_git_branch_info.outputs.branch_name }}-${{ steps.extract_git_branch_info.outputs.short_sha }}'
          fi  

      - name: Release tag
        id: rc_tag
        if: steps.publish_gcr.outcome == 'success' && startsWith(github.ref, 'refs/tags/RC')
        run: |
          echo "::set-output name=rc_image_tag::$(echo ${{ github.ref }} | sed -n 's/refs\/tags\/\(.*\)/\1/p')"

      - name: Configure RC Docker Image
        if: steps.publish_gcr.outcome == 'success' && startsWith(github.ref, 'refs/tags/RC')
        id: docker-rc-image-name
        run: |
            echo '::set-output name=image_name::${{ steps.rc_tag.outputs.rc_image_tag }}-${{ steps.extract_git_branch_info.outputs.short_sha }}'
          
      - name: Docker Image
        if: steps.publish_gcr.outcome == 'success'
        run: echo "The docker image name is ${{ steps.docker-image-config.outputs.image_name }} ${{ steps.docker-rc-image-name.outputs.image_name }} and Image publishing configured for branches - ${{ inputs.branchesToPublishImages }}"

      # The WI* clause that used to sit in this condition force-published four images to both
      # registries from every feature branch, ignoring branchesToPublishImages entirely.
      # Removed so the declared input governs. Repos that want it back can list "WI**".
      - name: Publish Image to GCR
        if:  steps.publish_gcr.outcome == 'success' && ( (contains(fromJSON(inputs.branchesToPublishImages), steps.extract_git_branch_info.outputs.branch_name) || steps.extract_git_branch_info.outputs.image_pattern_match == 'true' || startsWith(steps.extract_git_branch_info.outputs.branch_name, 'releases')) && !startsWith(github.ref, 'refs/tags/RC') )
        run: ./gradlew publishDockerImage -PimageName=${{ steps.docker-image-config.outputs.image_name }}

      - name: Publish RC Image to GCR
        if:  steps.publish_gcr.outcome == 'success' && startsWith(github.ref, 'refs/tags/RC')
        run: ./gradlew publishDockerImage -PimageName=${{ steps.docker-rc-image-name.outputs.image_name }}

      - name: Capture published GCR image refs
        id: gcr-images
        if: steps.publish_gcr.outcome == 'success'
        run: |
          IMAGE_TAG="${{ steps.docker-image-config.outputs.image_name }}${{ steps.docker-rc-image-name.outputs.image_name }}"
          IMAGE_TAG=$(echo "${IMAGE_TAG}" | tr '/' '-')
          GCR_REFS=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "us.gcr.io/blume-shared-container-images" | grep "${IMAGE_TAG}" || true)
          echo "refs<<EOF" >> $GITHUB_OUTPUT
          echo "${GCR_REFS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Published GCR images:"
          echo "${GCR_REFS}"

      # ====================================================================
      # OCP (OpenShift Container Platform) Image Publishing
      # Mirrors the GCR flow above — single publishOCPImage command handles
      # build, tag, login, and push. No docker-logout needed after GCR push
      # because each plugin uses its own per-task registryCredentials.
      # ====================================================================

      - name: Should Publish OCP DockerImage
        continue-on-error: true
        if: inputs.runsOn != 'ubuntu-latest'
        run: ./gradlew tasks --all | grep -w "publishOCPImage"
        id: publish_ocp

      - name: Configure OCP Docker Image
        continue-on-error: true
        if: inputs.runsOn != 'ubuntu-latest' && steps.publish_ocp.outcome == 'success' && !startsWith(github.ref, 'refs/tags/RC')
        id: ocp-docker-image-config
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            echo '::set-output name=image_name::${{ steps.extract_git_branch_info.outputs.branch_name }}-${{ steps.extract_git_branch_info.outputs.short_sha }}-pr'
          elif [[ ${{ github.event_name }} == 'push' ]]; then
            echo '::set-output name=image_name::${{ steps.extract_git_branch_info.outputs.branch_name }}-${{ steps.extract_git_branch_info.outputs.short_sha }}'
          else
            echo '::set-output name=image_name::${{ steps.extract_git_branch_info.outputs.branch_name }}-${{ steps.extract_git_branch_info.outputs.short_sha }}'
          fi

      - name: OCP Release Tag
        continue-on-error: true
        id: ocp_rc_tag
        if: inputs.runsOn != 'ubuntu-latest' && steps.publish_ocp.outcome == 'success' && startsWith(github.ref, 'refs/tags/RC')
        run: |
          echo "::set-output name=rc_image_tag::$(echo ${{ github.ref }} | sed -n 's/refs\/tags\/\(.*\)/\1/p')"

      - name: Configure RC OCP Docker Image
        continue-on-error: true
        if: inputs.runsOn != 'ubuntu-latest' && steps.publish_ocp.outcome == 'success' && startsWith(github.ref, 'refs/tags/RC')
        id: ocp-docker-rc-image-name
        run: |
          echo '::set-output name=image_name::${{ steps.ocp_rc_tag.outputs.rc_image_tag }}-${{ steps.extract_git_branch_info.outputs.short_sha }}'

      - name: OCP Docker Image
        continue-on-error: true
        if: inputs.runsOn != 'ubuntu-latest' && steps.publish_ocp.outcome == 'success'
        run: echo "The OCP docker image name is ${{ steps.ocp-docker-image-config.outputs.image_name }} ${{ steps.ocp-docker-rc-image-name.outputs.image_name }} and Image publishing configured for branches - ${{ inputs.branchesToPublishImagesToOCR }}"

      # OCP_REGISTRY_TOKEN moves to the environment, where OCPPublishPlugin already looks for
      # it, so the token is no longer visible in the process arguments.
      - name: Publish Image to OCP
        continue-on-error: true
        id: publish_ocp_image
        if:  inputs.runsOn != 'ubuntu-latest' && steps.publish_ocp.outcome == 'success' && ( (contains(fromJSON(inputs.branchesToPublishImagesToOCR), steps.extract_git_branch_info.outputs.branch_name) || steps.extract_git_branch_info.outputs.ocr_pattern_match == 'true' || startsWith(steps.extract_git_branch_info.outputs.branch_name, 'releases')) && !startsWith(github.ref, 'refs/tags/RC') )
        env:
          OCP_REGISTRY_TOKEN: ${{ secrets.OCP_REGISTRY_TOKEN }}
        run: ./gradlew publishOCPProdImage -PimageName=${{ steps.ocp-docker-image-config.outputs.image_name }}

      - name: Publish RC Image to OCP
        continue-on-error: true
        id: publish_rc_ocp_image
        if:  inputs.runsOn != 'ubuntu-latest' && steps.publish_ocp.outcome == 'success' && startsWith(github.ref, 'refs/tags/RC')
        env:
          OCP_REGISTRY_TOKEN: ${{ secrets.OCP_REGISTRY_TOKEN }}
        run: ./gradlew publishOCPProdImage -PimageName=${{ steps.ocp-docker-rc-image-name.outputs.image_name }}

      - name: Fallback - Pull from GCR and Push to OCP
        continue-on-error: true
        if: >-
          steps.publish_gcr.outcome == 'success' &&
          (inputs.runsOn == 'ubuntu-latest' ||
           (steps.publish_ocp_image.outcome != 'success' &&
            steps.publish_rc_ocp_image.outcome != 'success'))
        run: |
          while IFS= read -r gcr_ref; do
            if [[ -n "$gcr_ref" ]]; then
              echo "Triggering OCP push for: ${gcr_ref}"
              gh workflow run pull-gcr-push-ocp.yml \
                --repo rez-one/push-ocp-workflow \
                --ref master \
                -f gcr_image_ref="${gcr_ref}"
            fi
          done <<< "${{ steps.gcr-images.outputs.refs }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: audit build
        continue-on-error: true
        run: |
          ./gradlew tasks --all | grep -w -m 1 "auditBuild" | xargs ./gradlew -PbranchName=${{ steps.extract_git_branch_info.outputs.branch_name }}
        id: audit-task
        
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."

     

      



